<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 配置</title><style>body{background:#1e1e24;color:#dedee5;font:14px 'Segoe UI','Microsoft YaHei',sans-serif;padding:24px}h1{font-size:22px}p{color:#aaa;line-height:1.8;font-size:12px}label{display:block;margin:20px 0 7px}input,select{box-sizing:border-box;width:100%;border:1px solid #484351;background:#25232c;color:#eee;padding:10px;border-radius:5px}button{margin-top:22px;padding:10px 18px;background:#8764cf;color:#fff;border:0;border-radius:5px;cursor:pointer}button:disabled{opacity:.5}.status{color:#baa4f6;font-size:12px;min-height:20px}input[type=checkbox]{width:auto}</style></head><body><h1>AI 配置</h1><p>密钥仅保存在这台电脑的应用数据目录，不进入学习备份或 GitHub。留空保留已有密钥。</p><form id="config"><label for="provider">服务提供商</label><select id="provider"><option value="deepseek">DeepSeek</option><option value="openai">OpenAI</option></select><p id="configured" class="status"></p><label for="key">新的 API 密钥（可留空）</label><input id="key" type="password" autocomplete="off" maxlength="2000"><label for="model">模型名称</label><input id="model" value="deepseek-chat" required><label><input id="clear" type="checkbox">清除此服务已有密钥</label><button id="save" type="submit">保存并重启本机服务</button><p id="result" role="status"></p></form><p>保存后回到「设置与数据」，选择对应助手模式。API 费用由服务提供商收取。</p><script src="settings.cjs"></script></body></html>
