<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1130" viewBox="0 0 800 1130"><rect width="800" height="1130" fill="#fffefa"/><g fill="#3c493c" font-family="'Microsoft YaHei','PingFang SC',sans-serif"><text x="65" y="67" font-size="14" letter-spacing="3" fill="#8d987e">MISTAKE LAB / 示例习题页</text><text x="735" y="67" font-size="13" text-anchor="end" fill="#8d987e">数学 · 思维进阶</text><path d="M65 87H735" stroke="#dce1d1"/><text x="65" y="144" font-size="29" font-weight="500">第一章　函数与导数</text><text x="65" y="180" font-size="13" fill="#9ba58c">独立思考 · 写下过程 · 看见进步</text><rect x="65" y="216" width="670" height="31" fill="#eff2e6"/><text x="79" y="237" font-size="13" fill="#7c8c6b">基础巩固　/　Practice with intention</text><text x="71" y="289" font-size="19">01. 已知函数 f(x) = x² − 2ax + 1，a ∈ R。</text><text x="104" y="327" font-size="17">求函数在区间 [0, 2] 上的最小值，并讨论参数 a。</text><text x="104" y="370" font-size="14" fill="#9aa48d">请写出分类讨论过程，并检验边界条件。</text><path d="M104 415H704M104 458H704M104 501H704" stroke="#e7eadd"/><text x="71" y="594" font-size="19">02. 观察图象，回答下列问题。</text><text x="104" y="631" font-size="17">函数图象的对称轴与区间端点有怎样的关系？</text><g stroke="#a9b898" fill="none"><path d="M140 787H385M180 816V665"/><path d="M210 691Q280 855 355 691" stroke="#6e865d" stroke-width="2"/><path d="M280 682V809" stroke-dasharray="5 5"/></g><text x="285" y="832" font-size="13" fill="#92a080">x = a</text><text x="443" y="710" font-size="14" fill="#8e9c7d">用图象理解条件，</text><text x="443" y="737" font-size="14" fill="#8e9c7d">用过程验证结论。</text><text x="71" y="902" font-size="19">03. 尝试改变一个条件，构造一道新题。</text><path d="M104 955H704M104 998H704" stroke="#e7eadd"/><path d="M65 1060H735" stroke="#dce1d1"/><text x="65" y="1092" font-size="11" fill="#a9b09e">原创演示材料 · 非真实教材扫描件</text><text x="735" y="1092" font-size="13" text-anchor="end" fill="#8c9a7b">01</text></g></svg>